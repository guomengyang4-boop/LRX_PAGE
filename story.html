<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#202a2d">
  <meta name="description" content="从第一条私信开始，记录我们的故事。">
  <title>后来，我们的故事开始了</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="is-loading is-started story-page">
  <noscript><p class="noscript-message">这个页面需要启用 JavaScript，才能完成拆信与日期验证。</p></noscript>
  <div class="page-loader" id="pageLoader" aria-label="页面加载中"><i></i></div>

  <a class="story-back-link" href="./index.html" aria-label="返回第一章">← 第一章</a>

  <main class="story-page-main">
    <section class="story-chapter" id="storyChapter" aria-labelledby="storyChapterTitle">
      <div class="story-chapter__heading reveal">
        <p class="chapter-kicker" id="storyEyebrow"></p>
        <h1 id="storyChapterTitle"></h1>
        <p id="storyChapterIntro"></p>
      </div>
      <div class="story-timeline" id="storyTimeline" aria-label="从第一条私信开始的故事"></div>
    </section>

    <div class="envelope-section reveal" id="envelopeSection">
      <p class="envelope-section__eyebrow">AFTER-CREDITS LETTER</p>
      <button class="envelope-trigger" id="envelopeTrigger" type="button" aria-label="关于我对你" aria-expanded="false">
        <span class="envelope" aria-hidden="true">
          <span class="envelope__paper"><i></i><i></i><i></i></span>
          <span class="envelope__back"></span>
          <span class="envelope__flap"></span>
          <span class="envelope__front"></span>
          <span class="envelope__seal">❤</span>
        </span>
        <span class="envelope-label">关于我对你</span>
      </button>
    </div>

    <section class="chapter chapter-two" id="chapterTwo" aria-labelledby="chapterTwoTitle" aria-hidden="true">
      <div class="texture texture--paper" aria-hidden="true"></div>
      <div class="letter-page">
        <div class="paper-rule" aria-hidden="true"></div>
        <div class="chapter-heading chapter-heading--letter reveal-letter">
          <div class="chapter-heading__topline"><span>AFTER CREDITS / LETTER</span><span>ONLY FOR YOU</span></div>
          <p class="chapter-kicker">AFTER CREDITS <span>LETTER</span></p>
          <h2 id="chapterTwoTitle"></h2>
          <p class="chapter-deck" id="chapterTwoIntro"></p>
        </div>
        <div class="letter-copy" id="letterCopy"></div>
        <figure class="important-photo reveal-letter">
          <button class="important-photo__media" id="importantPhotoMedia" type="button" aria-label="查看重要照片"></button>
          <figcaption id="importantPhotoCaption"></figcaption>
        </figure>
        <div class="confession-intro reveal-letter">
          <span class="confession-intro__index">ONE LAST SCENE</span>
          <p id="confessionBefore"></p>
          <button class="continue-button" id="continueButton" type="button" aria-expanded="false">
            <span id="confessionButtonText"></span><span aria-hidden="true">↓</span>
          </button>
        </div>
        <div class="confession-reveal" id="confessionReveal" aria-live="polite">
          <p class="confession-text" id="confessionFinal"></p>
          <div class="ending-scene">
            <button class="next-photo" id="nextPhotoMedia" type="button" aria-label="查看下一张照片"></button>
            <p id="endingText"></p>
            <p class="to-be-continued" id="continuedText"></p>
          </div>
        </div>

        <section class="birthday-gate" id="birthdayGate" aria-labelledby="birthdayGateTitle" hidden>
          <div class="birthday-gate__copy">
            <p class="birthday-kicker" id="birthdayGateEyebrow"></p>
            <h2 id="birthdayGateTitle"></h2>
            <p id="birthdayGateDescription"></p>
          </div>
          <label class="birthday-switch">
            <input id="birthdayEditionSwitch" type="checkbox" role="switch" aria-controls="birthdayEdition">
            <span class="birthday-switch__track" aria-hidden="true"><i></i></span>
            <span id="birthdaySwitchLabel"></span>
          </label>
          <button class="birthday-enter" id="enterBirthdayButton" type="button" disabled>
            <span id="birthdayEnterLabel"></span><span aria-hidden="true">→</span>
          </button>
        </section>

        <section class="birthday-edition" id="birthdayEdition" aria-labelledby="birthdayEditionTitle" aria-hidden="true" hidden>
          <header class="birthday-edition__cover">
            <p class="birthday-kicker" id="birthdayCoverEyebrow"></p>
            <span class="birthday-edition__stamp" aria-hidden="true">BIRTHDAY<br>EDITION</span>
            <h2 id="birthdayEditionTitle"></h2>
            <p id="birthdayCoverIntro"></p>
            <button class="birthday-open" id="openBirthdayStoryButton" type="button" aria-expanded="false">
              <span id="birthdayOpenLabel"></span><span aria-hidden="true">↓</span>
            </button>
          </header>

          <div class="birthday-story" id="birthdayStory" aria-hidden="true">
            <div class="birthday-story__heading">
              <p class="birthday-kicker" id="birthdayProcessEyebrow"></p>
              <h2 id="birthdayProcessTitle"></h2>
              <p id="birthdayProcessIntro"></p>
            </div>
            <div class="birthday-process" id="birthdayProcess"></div>

            <div class="birthday-letter-entry">
              <p class="birthday-kicker" id="birthdayLetterEntryEyebrow"></p>
              <button class="birthday-envelope-trigger" id="birthdayLetterTrigger" type="button" aria-expanded="false">
                <span class="birthday-envelope" aria-hidden="true">
                  <span class="birthday-envelope__paper"></span>
                  <span class="birthday-envelope__back"></span>
                  <span class="birthday-envelope__flap"></span>
                  <span class="birthday-envelope__front"></span>
                  <span class="birthday-envelope__seal">✦</span>
                </span>
                <span id="birthdayLetterEntryLabel"></span>
              </button>
            </div>

            <article class="birthday-letter" id="birthdayLetter" aria-labelledby="birthdayLetterTitle" aria-hidden="true" hidden>
              <div class="birthday-letter__topline"><span id="birthdayLetterEyebrow"></span><span id="birthdayLetterDate"></span></div>
              <h2 id="birthdayLetterTitle"></h2>
              <p class="birthday-letter__intro" id="birthdayLetterIntro"></p>
              <div class="birthday-letter__copy" id="birthdayLetterCopy"></div>
              <div class="birthday-dialogue">
                <p id="birthdayDialoguePrompt"></p>
                <div class="birthday-dialogue__options" id="birthdayDialogueOptions"></div>
                <p class="birthday-dialogue__response" id="birthdayDialogueResponse" aria-live="polite"></p>
              </div>
            </article>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div class="letter-stage" id="letterStage" aria-hidden="true">
    <div class="letter-stage__backdrop"></div>
    <section class="date-letter" role="dialog" aria-modal="true" aria-labelledby="dateQuestionTitle">
      <div class="date-letter__topline"><span>PRIVATE SCREENING</span><span>AFTER CREDITS · 01</span></div>
      <div class="date-form-view" id="dateFormView">
        <p class="date-letter__prelude" id="datePrelude"></p>
        <h2 id="dateQuestionTitle"></h2>
        <form id="dateForm" novalidate>
          <fieldset>
            <legend class="sr-only">选择第一次见面的日期</legend>
            <div class="date-selects">
              <label><select id="yearSelect" aria-label="年份" required></select><span>年</span></label><i aria-hidden="true">·</i>
              <label><select id="monthSelect" aria-label="月份" required></select><span>月</span></label><i aria-hidden="true">·</i>
              <label><select id="daySelect" aria-label="日期" required></select><span>日</span></label>
            </div>
            <p class="date-message" id="dateMessage" aria-live="polite"></p>
            <button class="date-submit" type="submit">确认这一天 <span aria-hidden="true">→</span></button>
          </fieldset>
        </form>
      </div>
      <div class="date-success" id="dateSuccess" aria-live="polite">
        <p class="date-success__value" id="dateSuccessValue"></p>
        <span class="date-success__check" aria-hidden="true">✓</span>
        <p id="dateCorrectText"></p>
        <p class="muted" id="dateTransitionText"></p>
        <button class="date-success__continue" id="enterChapterTwoButton" type="button"></button>
      </div>
    </section>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片查看" aria-hidden="true">
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="关闭大图">×</button>
    <div class="lightbox__stage" id="lightboxStage"></div>
    <p class="lightbox__caption" id="lightboxCaption"></p>
  </div>

  <script src="./content.js"></script>
  <script src="./story.js"></script>
</body>
</html>
