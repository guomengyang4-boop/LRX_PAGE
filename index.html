<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7efe8">
  <meta name="description" content="一页只属于她自己的生活档案。">
  <title>给淡淡的你，留一页日常</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="is-loading chapter-one-page">
  <noscript><p class="noscript-message">这个页面需要启用 JavaScript 才能完整展示。</p></noscript>
  <div class="page-loader" id="pageLoader" aria-label="页面加载中"><i></i></div>

  <header class="intro" id="intro" aria-labelledby="introTitle">
    <div class="texture texture--dark" aria-hidden="true"></div>
    <div class="intro__frames" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="intro__content">
      <p class="intro__eyebrow" id="openingEyebrow"></p>
      <p class="intro__folio">A LITTLE ARCHIVE <span>FOR YOU</span></p>
      <h1 id="introTitle"></h1>
      <p class="intro__line" id="openingSubtitle"></p>
      <button class="line-button intro__button" id="startButton" type="button">
        <span id="startButtonText"></span><span aria-hidden="true">→</span>
      </button>
    </div>
    <div class="intro__footer"><span id="openingHint"></span><span>CHAPTER / 01</span></div>
  </header>

  <main id="mainContent">
    <section class="chapter chapter-one" id="chapterOne" aria-labelledby="chapterOneTitle">
      <div class="texture texture--dark texture--fixed" aria-hidden="true"></div>
      <div class="archive-rail" aria-hidden="true"><span>01</span><i></i><span>END</span></div>

      <div class="chapter-heading chapter-heading--moments reveal">
        <div class="chapter-heading__topline"><span>A LITTLE ARCHIVE OF YOUR DAYS</span><span>ONLY FOR YOU</span></div>
        <p class="chapter-kicker">CHAPTER ONE <span>01</span></p>
        <h2 id="chapterOneTitle"></h2>
        <p class="chapter-deck" id="chapterOneIntro"></p>
        <div class="chapter-heading__coordinates" aria-hidden="true">HER MOMENTS / BEFORE WE MET</div>
        <div class="scroll-mark" aria-hidden="true"><span></span></div>
      </div>

      <div class="timeline-heading reveal" aria-hidden="true">
        <span>她曾经分享过的日常</span><span id="memoryCountLabel">00 MOMENTS</span>
      </div>
      <div class="memory-timeline moments-feed" id="memoryTimeline" aria-label="她以前的朋友圈日常"></div>

      <div class="chapter-one-ending reveal">
        <span class="ending-index" aria-hidden="true">END OF CHAPTER / 01</span>
        <p id="chapterOneEndingPrimary"></p>
        <p class="muted" id="chapterOneEndingSecondary"></p>
        <p class="chapter-one-ending__note" id="chapterOneClosingNote"></p>
        <p class="chapter-one-ending__question" id="chapterOneEndingQuestion"></p>
        <button class="story-entry-button" id="storyEntryButton" type="button">
          <span id="storyButtonText"></span><span aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片查看" aria-hidden="true">
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="关闭大图">×</button>
    <div class="lightbox__stage" id="lightboxStage"></div>
    <p class="lightbox__caption" id="lightboxCaption"></p>
  </div>

  <script src="./content.js"></script>
  <script src="./script.js"></script>
</body>
</html>
